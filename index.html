<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mundo de Entrenamiento - Osvaldo #58</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080c14; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }

    /* HUD Superior */
    #hud {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 25;
    }
    .hud-left { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .hud-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .badge {
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px);
      border: 2px solid #38bdf8; border-radius: 14px;
      padding: 8px 16px; color: #fff; font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 10px; font-size: 14px;
    }
    .badge-icon { font-size: 20px; }
    .hud-btn {
      pointer-events: auto; background: rgba(30, 41, 59, 0.88);
      border: 2px solid #64748b; color: #fff; border-radius: 12px;
      padding: 8px 14px; font-weight: bold; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      text-decoration: none; transition: 0.2s all;
    }
    .hud-btn:hover { border-color: #38bdf8; background: #334155; }
    .hud-btn-ball { border-color: #fbbf24; background: rgba(245, 158, 11, 0.2); }
    .hud-btn-ball:hover { border-color: #f59e0b; background: rgba(245, 158, 11, 0.4); }

    /* Mini-mapa (Radar) */
    #radar-container {
      width: 110px; height: 150px; background: rgba(15, 23, 42, 0.88);
      border: 2px solid #38bdf8; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); pointer-events: none;
    }
    #radar { width: 100%; height: 100%; display: block; }

    /* Cartel de ¡GOOOOOOL! */
    #goal-banner {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: 4px solid #ffffff; padding: 20px 48px; border-radius: 30px;
      color: #0f172a; font-size: 42px; font-weight: 900; letter-spacing: 2px;
      box-shadow: 0 0 60px rgba(251, 191, 36, 0.9), 0 20px 40px rgba(0,0,0,0.7);
      display: none; z-index: 80; text-align: center; pointer-events: none;
      animation: goalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes goalPop {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* Menú flotante de personalización */
    #customizer-panel {
      position: absolute; top: 75px; right: 16px; width: 280px;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
      border: 2px solid #38bdf8; border-radius: 18px; padding: 16px;
      display: none; flex-direction: column; gap: 14px; z-index: 30;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); color: #fff;
    }
    .cust-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
    .kit-selector { display: flex; flex-direction: column; gap: 8px; }
    .kit-opt {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-radius: 10px; border: 2px solid #334155; background: #1e293b;
      cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.15s;
    }
    .kit-opt:hover { border-color: #38bdf8; background: #243248; }
    .kit-opt.active { border-color: #fbbf24; background: #1e293b; box-shadow: 0 0 12px rgba(251, 191, 36, 0.4); }
    .kit-preview-swatch {
      display: flex; flex-direction: column; width: 22px; height: 32px; border-radius: 4px; overflow: hidden; border: 1px solid #475569;
    }
    .swatch-part { flex: 1; width: 100%; }

    .time-selector { display: flex; gap: 8px; }
    .time-btn {
      flex: 1; padding: 8px 0; border-radius: 10px; border: 2px solid #475569;
      background: #1e293b; color: #cbd5e1; font-weight: bold; cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 13px;
    }
    .time-btn.active { border-color: #38bdf8; background: #0284c7; color: #fff; }

    /* Indicador interactivo en pantalla */
    #prompt {
      position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95); border: 2px solid #fbbf24;
      padding: 14px 26px; border-radius: 40px; color: #fff; font-size: 15px; font-weight: 800;
      display: none; align-items: center; gap: 12px; pointer-events: auto; cursor: pointer;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.6); animation: bounce 0.6s infinite alternate;
      z-index: 20; text-transform: uppercase; letter-spacing: 0.5px;
    }
    @keyframes bounce { 0% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -8px); } }

    /* Controles virtuales touch */
    #touch-controls {
      position: absolute; width: 100%; height: 100%;
      pointer-events: none; z-index: 15; display: none;
    }
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
      border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px dashed rgba(255,255,255,0.25);
      pointer-events: auto; touch-action: none;
    }
    #joystick-knob {
      width: 50px; height: 50px; border-radius: 50%; background: #38bdf8;
      position: absolute; top: 35px; left: 35px; pointer-events: none;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }
    .action-btn {
      position: absolute; width: 65px; height: 65px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.85); border: 3px solid #38bdf8;
      color: #fff; font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto; touch-action: manipulation; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .action-btn:active { transform: scale(0.9); background: #38bdf8; }
    #jump-btn { bottom: 35px; right: 35px; }
    #kick-btn { bottom: 115px; right: 35px; border-color: #fbbf24; }

    /* Modal Visor de Examen (Opción A - Overlay sin salir del juego) */
    #test-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 30, 0.88); backdrop-filter: blur(10px);
      z-index: 100; display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    #test-card {
      width: 100%; max-width: 960px; height: 92%; background: #0f172a;
      border-radius: 20px; border: 2px solid #38bdf8;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #test-header {
      background: #1e293b; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #334155;
    }
    #test-title-bar { color: #fff; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .header-actions { display: flex; gap: 10px; }
    .btn-action {
      background: #334155; border: none; color: #fff; border-radius: 8px;
      padding: 8px 14px; font-weight: bold; cursor: pointer; font-size: 13px; text-decoration: none;
    }
    .btn-action:hover { background: #475569; }
    .btn-close { background: #ef4444; }
    .btn-close:hover { background: #dc2626; }
    #test-iframe { width: 100%; flex: 1; border: none; background: #ffffff; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD Principal -->
  <div id="hud">
    <div class="hud-left">
      <div class="badge">
        <span class="badge-icon">⚽</span>
        <div>
          <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Capitán #58</div>
          <div>Osvaldo</div>
        </div>
      </div>
      <div id="radar-container">
        <canvas id="radar" width="110" height="150"></canvas>
      </div>
    </div>

    <div class="hud-right">
      <button class="hud-btn hud-btn-ball" onclick="respawnBall()" title="Traer el balón a tus pies">⚽ Traer Balón</button>
      <a href="clasico.html" class="hud-btn">📋 Menú Clásico</a>
      <div class="badge" style="border-color: #fbbf24;">
        <span class="badge-icon">🏆</span>
        <span id="score-text">0 / 4</span>
      </div>
      <button class="hud-btn" onclick="toggleCustomizer()">⚙️ Ajustes</button>
    </div>
  </div>

  <!-- Cartel Celebración de Gol -->
  <div id="goal-banner">
    <div>⚽ ¡GOOOOOOL! ⚽</div>
    <div style="font-size: 18px; font-weight: 700; margin-top: 6px; color: #1e293b;">¡GOLAZO DE OSVALDO #58!</div>
  </div>

  <!-- Menú de Personalización -->
  <div id="customizer-panel">
    <div class="cust-title">Ambiente de Cancha</div>
    <div class="time-selector">
      <button class="time-btn active" id="btn-day" onclick="setTimeMode('day')">☀️ Día</button>
      <button class="time-btn" id="btn-night" onclick="setTimeMode('night')">🌙 Noche</button>
    </div>

    <div class="cust-title">Uniformes Osvaldo (#58)</div>
    <div class="kit-selector">
      <div class="kit-opt active" onclick="setKit(0, this)">
        <div class="kit-preview-swatch">
          <div class="swatch-part" style="background: #1d4ed8;"></div>
          <div class="swatch-part" style="background: #dc2626;"></div>
          <div class="swatch-part" style="background: #dc2626;"></div>
        </div>
        <span>1. Azul / Rojo / Rojo</span>
      </div>
      <div class="kit-opt" onclick="setKit(1, this)">
        <div class="kit-preview-swatch">
          <div class="swatch-part" style="background: #38bdf8;"></div>
          <div class="swatch-part" style="background: #38bdf8;"></div>
          <div class="swatch-part" style="background: #f8fafc;"></div>
        </div>
        <span>2. Celeste / Celeste / Blanco</span>
      </div>
      <div class="kit-opt" onclick="setKit(2, this)">
        <div class="kit-preview-swatch">
          <div class="swatch-part" style="background: #111827;"></div>
          <div class="swatch-part" style="background: #111827;"></div>
          <div class="swatch-part" style="background: #dc2626;"></div>
        </div>
        <span>3. Negro / Negro / Rojo</span>
      </div>
      <div class="kit-opt" onclick="setKit(3, this)">
        <div class="kit-preview-swatch">
          <div class="swatch-part" style="background: #f8fafc;"></div>
          <div class="swatch-part" style="background: #1d4ed8;"></div>
          <div class="swatch-part" style="background: #f8fafc;"></div>
        </div>
        <span>4. Blanco / Azul / Blanco</span>
      </div>
    </div>
  </div>

  <!-- Prompt Flotante -->
  <div id="prompt">
    <span id="prompt-icon">⚽</span>
    <span id="prompt-text">Presiona [E] o toca para repasar</span>
  </div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div class="action-btn" id="kick-btn">⚽</div>
    <div class="action-btn" id="jump-btn">⏫</div>
  </div>

  <!-- Modal Opción A -->
  <div id="test-modal">
    <div id="test-card">
      <div id="test-header">
        <div id="test-title-bar">
          <span id="modal-icon">📖</span>
          <span id="modal-title">Repaso</span>
        </div>
        <div class="header-actions">
          <a id="modal-external-link" href="#" target="_blank" class="btn-action">Abrir Pestaña Nueva ↗</a>
          <button class="btn-action btn-close" onclick="closeTest()">✕ Volver a la Cancha</button>
        </div>
      </div>
      <iframe id="test-iframe" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    // Audio sintetizado
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function playWhistle(long = false) {
      playBeep(2400, 'triangle', 0.15);
      setTimeout(() => playBeep(2600, 'triangle', long ? 0.6 : 0.25), 160);
      if (long) setTimeout(() => playBeep(2500, 'triangle', 0.8), 500);
    }
    function playGoalCheer() {
      playWhistle(true);
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playBeep(freq, 'triangle', 0.4), i * 140);
      });
    }

    // Three.js Setup
    const scene = new THREE.Scene();
    const dayColor = 0x87ceeb;
    const nightColor = 0x080e1e;
    scene.background = new THREE.Color(dayColor);
    scene.fog = new THREE.FogExp2(dayColor, 0.009);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xfffaed, 0.95);
    sunLight.position.set(40, 70, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    // Dimensiones de Cancha
    const pitchWidth = 66, pitchLength = 96;
    const limitX = (pitchWidth / 2) - 1.5;
    const limitZ = (pitchLength / 2) - 1.5;

    // Pasto con corte a rayas estilo profesional
    const stripesCount = 12;
    const stripeLength = pitchLength / stripesCount;
    const fieldGroup = new THREE.Group();
    const matGreen1 = new THREE.MeshLambertMaterial({ color: 0x2e8540 });
    const matGreen2 = new THREE.MeshLambertMaterial({ color: 0x277437 });

    for (let i = 0; i < stripesCount; i++) {
      const stripeGeo = new THREE.PlaneGeometry(pitchWidth, stripeLength);
      const stripe = new THREE.Mesh(stripeGeo, i % 2 === 0 ? matGreen1 : matGreen2);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0, -pitchLength / 2 + stripeLength * i + stripeLength / 2);
      stripe.receiveShadow = true;
      fieldGroup.add(stripe);
    }
    scene.add(fieldGroup);

    // Líneas Reglamentarias
    function createLine(w, h, x, z) {
      const line = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: 0xffffff, depthWrite: false })
      );
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.02, z);
      scene.add(line);
    }
    createLine(pitchWidth - 4, 0.6, 0, (pitchLength - 4) / 2);
    createLine(pitchWidth - 4, 0.6, 0, -(pitchLength - 4) / 2);
    createLine(0.6, pitchLength - 4, (pitchWidth - 4) / 2, 0);
    createLine(0.6, pitchLength - 4, -(pitchWidth - 4) / 2, 0);
    createLine(pitchWidth - 4, 0.6, 0, 0); // Centro

    // Círculo central
    const centerCircle = new THREE.Mesh(
      new THREE.RingGeometry(8.8, 9.4, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, depthWrite: false, side: THREE.DoubleSide })
    );
    centerCircle.rotation.x = -Math.PI / 2;
    centerCircle.position.y = 0.02;
    scene.add(centerCircle);

    // Banderines de Tiro de Esquina
    function buildCornerFlag(x, z) {
      const flagGroup = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      pole.position.y = 1.1;
      const cloth = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.5), new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide }));
      cloth.position.set(0.35, 1.9, 0);
      flagGroup.add(pole, cloth);
      flagGroup.position.set(x, 0, z);
      scene.add(flagGroup);
    }
    buildCornerFlag(limitX + 0.5, limitZ + 0.5);
    buildCornerFlag(-limitX - 0.5, limitZ + 0.5);
    buildCornerFlag(limitX + 0.5, -limitZ - 0.5);
    buildCornerFlag(-limitX - 0.5, -limitZ - 0.5);

    // Graderías y Vallas
    function buildStadiumBounds() {
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const seatMat1 = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
      const seatMat2 = new THREE.MeshLambertMaterial({ color: 0xb91c1c });

      [-1, 1].forEach(side => {
        const grandstand = new THREE.Group();
        for (let tier = 0; tier < 4; tier++) {
          const step = new THREE.Mesh(
            new THREE.BoxGeometry(4, 1.2, pitchLength),
            tier % 2 === 0 ? seatMat1 : seatMat2
          );
          step.position.set(tier * 3.5, (tier * 1.2) + 0.6, 0);
          grandstand.add(step);
        }
        grandstand.position.x = side * ((pitchWidth / 2) + 4);
        if (side === 1) grandstand.rotation.y = Math.PI;
        scene.add(grandstand);

        const board = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.5, pitchLength), wallMat);
        board.position.set(side * ((pitchWidth / 2) + 0.5), 0.75, 0);
        scene.add(board);
      });

      [-1, 1].forEach(side => {
        const grandstand = new THREE.Group();
        for (let tier = 0; tier < 3; tier++) {
          const step = new THREE.Mesh(
            new THREE.BoxGeometry(pitchWidth + 24, 1.2, 4),
            tier % 2 === 0 ? seatMat2 : seatMat1
          );
          step.position.set(0, (tier * 1.2) + 0.6, tier * 3.5);
          grandstand.add(step);
        }
        grandstand.position.z = side * ((pitchLength / 2) + 4);
        if (side === 1) grandstand.rotation.y = Math.PI;
        scene.add(grandstand);

        const board = new THREE.Mesh(new THREE.BoxGeometry(pitchWidth, 1.5, 0.8), wallMat);
        board.position.set(0, 0.75, side * ((pitchLength / 2) + 0.5));
        scene.add(board);
      });
    }
    buildStadiumBounds();

    // Porterías
    function buildGoal(zPos, rotY) {
      const goal = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4), mat); p1.position.set(-6, 2, 0);
      const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4), mat); p2.position.set(6, 2, 0);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 12), mat);
      bar.rotation.z = Math.PI / 2; bar.position.set(0, 4, 0);
      goal.add(p1, p2, bar);
      goal.position.set(0, 0, zPos);
      goal.rotation.y = rotY;
      scene.add(goal);
    }
    buildGoal(44, 0);
    buildGoal(-44, Math.PI);

    // Torres de Reflectores
    const floodlights = [];
    function buildFloodlight(x, z) {
      const tower = new THREE.Group();
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 18), new THREE.MeshStandardMaterial({ color: 0x475569 }));
      mast.position.y = 9;
      const head = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.8, 0.6), new THREE.MeshBasicMaterial({ color: 0xffffcc }));
      head.position.set(0, 18, 0);
      tower.add(mast, head);
      tower.position.set(x, 0, z);
      tower.lookAt(0, 0, 0);
      scene.add(tower);

      const light = new THREE.SpotLight(0xfffaed, 0, 90, Math.PI / 3, 0.5);
      light.position.set(x, 18, z);
      light.target.position.set(0, 0, 0);
      scene.add(light);
      scene.add(light.target);
      floodlights.push({ spot: light, bulb: head });
    }
    buildFloodlight(-36, -50);
    buildFloodlight(36, -50);
    buildFloodlight(-36, 50);
    buildFloodlight(36, 50);

    // Textura Cara Roblox
    function createFaceTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffdbac';
      ctx.fillRect(0, 0, 128, 128);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(26, 42, 18, 26);
      ctx.fillRect(84, 42, 18, 26);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(28, 44, 8, 8);
      ctx.fillRect(86, 44, 8, 8);

      ctx.fillStyle = '#271910';
      ctx.fillRect(24, 32, 22, 6);
      ctx.fillRect(82, 32, 22, 6);

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(64, 84, 22, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      return new THREE.CanvasTexture(c);
    }

    // Textura Dorsal: "OSVALDO" + 58
    function createJerseyNumberTexture(kitColor, textColor) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = kitColor;
      ctx.fillRect(0, 0, 256, 256);

      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';

      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('OSVALDO', 128, 65);

      ctx.font = 'bold 125px sans-serif';
      ctx.fillText('58', 128, 195);

      return new THREE.CanvasTexture(c);
    }

    // Avatar de Osvaldo
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
    const hairMat = new THREE.MeshLambertMaterial({ color: 0x271910 });
    const jerseyMat = new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }); // Arriba
    const shortsMat = new THREE.MeshLambertMaterial({ color: 0xdc2626 }); // Medio
    const socksMat = new THREE.MeshLambertMaterial({ color: 0xdc2626 });  // Abajo
    const cleatsMat = new THREE.MeshLambertMaterial({ color: 0xff5500 }); // Tacos naranja brillante
    const captainArmbandMat = new THREE.MeshLambertMaterial({ color: 0xfbbf24 }); // Brazalete Capitán

    const player = new THREE.Group();
    const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), skinMat); head.position.y = 2.4;
    const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 0.92), new THREE.MeshBasicMaterial({ map: createFaceTexture(), transparent: true }));
    facePlane.position.set(0, 2.4, 0.51);

    const hair = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.4, 1.05), hairMat); hair.position.y = 2.8;

    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.7), jerseyMat); torso.position.y = 1.4;

    const backNumberMat = new THREE.MeshBasicMaterial({
      map: createJerseyNumberTexture('#1d4ed8', '#ffffff'),
      transparent: false
    });
    const backNumber = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), backNumberMat);
    backNumber.position.set(0, 1.45, -0.36);
    backNumber.rotation.y = Math.PI;

    const shorts = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.5, 0.72), shortsMat); shorts.position.y = 0.85;

    function buildLeg(x) {
      const legGroup = new THREE.Group();
      const sock = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.65, 0.45), socksMat);
      sock.position.y = 0.45;
      const cleat = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.25, 0.65), cleatsMat);
      cleat.position.set(0, 0.12, 0.08);
      legGroup.add(sock, cleat);
      legGroup.position.set(x, 0, 0);
      return legGroup;
    }
    const leftLeg = buildLeg(-0.32);
    const rightLeg = buildLeg(0.32);

    const leftArmGroup = new THREE.Group();
    const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1, 0.35), skinMat); leftArm.position.y = 0.5;
    const armband = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.25, 0.38), captainArmbandMat); armband.position.y = 0.75;
    leftArmGroup.add(leftArm, armband);
    leftArmGroup.position.set(-0.85, 0.9, 0);

    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1, 0.35), skinMat);
    rightArm.position.set(0.85, 1.4, 0);

    player.add(head, facePlane, hair, torso, backNumber, shorts, leftLeg, rightLeg, leftArmGroup, rightArm);
    player.traverse(c => { if(c.isMesh) c.castShadow = true; });
    scene.add(player);

    // Pelota de fútbol
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.65, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
    );
    ball.position.set(0, 0.65, 4);
    ball.castShadow = true;
    scene.add(ball);
    let ballVel = new THREE.Vector3(0, 0, 0);

    // Recuperar Balón Manualmente
    function respawnBall() {
      ball.position.set(player.position.x, 0.65, player.position.z + 1.8);
      ballVel.set(0, 0, 0);
      playBeep(420, 'sine', 0.15);
    }

    // Portales Dinámicos con Columna de Luz
    const portals = [];
    let currentPortalNear = null;

    function buildPortals(tests) {
      const radius = 22;
      tests.forEach((test, i) => {
        const angle = (i / tests.length) * Math.PI * 2 + (Math.PI / 4);
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;

        const group = new THREE.Group();
        group.position.set(x, 0, z);

        const frameMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
        const post1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 5, 0.8), frameMat); post1.position.set(-2, 2.5, 0);
        const post2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 5, 0.8), frameMat); post2.position.set(2, 2.5, 0);
        const lintel = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.8, 0.8), frameMat); lintel.position.set(0, 5, 0);

        const coreMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(test.color || 0x38bdf8), transparent: true, opacity: 0.85 });
        const core = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 4.4), coreMat); core.position.set(0, 2.6, 0);

        const beamMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(test.color || 0x38bdf8),
          transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false
        });
        const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2.2, 40, 16, 1, true), beamMat);
        beam.position.set(0, 20, 0);

        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 160;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0f172a'; ctx.roundRect(0, 0, 512, 160, 24); ctx.fill();
        ctx.strokeStyle = test.color || '#38bdf8'; ctx.lineWidth = 8; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText((test.icono || '⚽') + ' ' + test.materia, 256, 65);
        ctx.fillStyle = '#94a3b8'; ctx.font = '26px sans-serif';
        ctx.fillText(test.titulo, 256, 120);

        const textTex = new THREE.CanvasTexture(canvas);
        const sign = new THREE.Mesh(new THREE.PlaneGeometry(5, 1.6), new THREE.MeshBasicMaterial({ map: textTex, transparent: true }));
        sign.position.set(0, 6.3, 0);

        group.add(post1, post2, lintel, core, beam, sign);
        group.lookAt(0, 0, 0);
        scene.add(group);

        portals.push({ ...test, position: new THREE.Vector3(x, 0, z), mesh: group, coreMesh: core, beamMesh: beam });
      });
      document.getElementById('score-text').textContent = `0 / ${tests.length}`;
    }

    // Carga de tests.json
    fetch('tests.json')
      .then(r => r.json())
      .then(data => buildPortals(data))
      .catch(err => {
        buildPortals([
          { id: "math", titulo: "Math Practice", materia: "Matemáticas", url: "math.html", color: "#3b82f6", icono: "📐" },
          { id: "science", titulo: "Life Cycles", materia: "Science", url: "Science-Topic4-Life-Cycles-and-traits.html", color: "#10b981", icono: "🧬" },
          { id: "adverbios", titulo: "Los Adverbios", materia: "Español", url: "adverbios.html", color: "#f59e0b", icono: "📚" },
          { id: "thunder-rose", titulo: "Thunder Rose", materia: "English", url: "Thunder Rose.html", color: "#8b5cf6", icono: "⚡" }
        ]);
      });

    // Control Personalización
    function toggleCustomizer() {
      const p = document.getElementById('customizer-panel');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    }

    function setTimeMode(mode) {
      document.getElementById('btn-day').classList.toggle('active', mode === 'day');
      document.getElementById('btn-night').classList.toggle('active', mode === 'night');

      if (mode === 'day') {
        scene.background.setHex(dayColor);
        scene.fog.color.setHex(dayColor);
        ambientLight.intensity = 0.7;
        sunLight.intensity = 0.95;
        floodlights.forEach(f => { f.spot.intensity = 0; f.bulb.material.color.setHex(0x334155); });
      } else {
        scene.background.setHex(nightColor);
        scene.fog.color.setHex(nightColor);
        ambientLight.intensity = 0.25;
        sunLight.intensity = 0.15;
        floodlights.forEach(f => { f.spot.intensity = 1.4; f.bulb.material.color.setHex(0xffffaa); });
      }
    }

    // 4 Uniformes
    const kitPresets = [
      { topHex: 0x1d4ed8, midHex: 0xdc2626, botHex: 0xdc2626, topCss: '#1d4ed8', textCss: '#ffffff' }, // 1. Azul / Rojo / Rojo
      { topHex: 0x38bdf8, midHex: 0x38bdf8, botHex: 0xf8fafc, topCss: '#38bdf8', textCss: '#0f172a' }, // 2. Celeste / Celeste / Blanco
      { topHex: 0x111827, midHex: 0x111827, botHex: 0xdc2626, topCss: '#111827', textCss: '#ffffff' }, // 3. Negro / Negro / Rojo
      { topHex: 0xf8fafc, midHex: 0x1d4ed8, botHex: 0xf8fafc, topCss: '#f8fafc', textCss: '#1d4ed8' }  // 4. Blanco / Azul / Blanco
    ];

    function setKit(index, el) {
      document.querySelectorAll('.kit-opt').forEach(b => b.classList.remove('active'));
      el.classList.add('active');

      const k = kitPresets[index];
      jerseyMat.color.setHex(k.topHex);
      shortsMat.color.setHex(k.midHex);
      socksMat.color.setHex(k.botHex);

      backNumberMat.map = createJerseyNumberTexture(k.topCss, k.textCss);
      backNumberMat.needsUpdate = true;
    }

    // Rotación de Cámara 360° (Mouse & Touch)
    let cameraAngle = 0;

    const container = document.getElementById('canvas-container');
    container.addEventListener('mousedown', e => {
