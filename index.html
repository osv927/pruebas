<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misión Escolar | Mati</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
      max-width: 600px;
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p.desc {
      color: var(--subtext);
      font-size: 1rem;
    }

    .grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .card-icon {
      font-size: 2rem;
      line-height: 1;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 12px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      text-transform: capitalize;
    }

    .card-action {
      margin-top: 16px;
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card:hover .card-action {
      color: #7dd3fc;
    }

    .status-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">Centro de Práctica</span>
    <h1>Retos de Mati</h1>
    <p class="desc">Selecciona la prueba que vas a resolver hoy.</p>
  </header>

  <main class="grid" id="contenedor-pruebas">
    <div class="status-box">Cargando retos disponibles...</div>
  </main>

  <script>
    // Configuración lista para tu repo
    const GITHUB_USER = 'osv927';
    const GITHUB_REPO = 'pruebas';
    const FOLDER_PATH = ''; // Si están en la raíz se queda vacío

    function obtenerIcono(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes('mate') || n.includes('suma') || n.includes('resta') || n.includes('fraccion') || n.includes('multiplica') || n.includes('divis')) return '📐';
      if (n.includes('esp') || n.includes('lengua') || n.includes('acento') || n.includes('lectura') || n.includes('palabra')) return '📚';
      if (n.includes('cien') || n.includes('insecto') || n.includes('animal') || n.includes('planta') || n.includes('cuerpo')) return '🔬';
      if (n.includes('soc') || n.includes('historia') || n.includes('mapa') || n.includes('geografia')) return '🌍';
      return '📝';
    }

    async function listarRetos() {
      const grid = document.getElementById('contenedor-pruebas');
      const endpoint = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;

      try {
        const respuesta = await fetch(endpoint);
        if (!respuesta.ok) throw new Error('No se pudo consultar GitHub API');

        const items = await respuesta.json();

        // Filtra solo archivos .html excluyendo index.html
        const pruebas = items.filter(archivo => 
          archivo.type === 'file' &&
          archivo.name.endsWith('.html') &&
          archivo.name.toLowerCase() !== 'index.html'
        );

        if (pruebas.length === 0) {
          grid.innerHTML = '<div class="status-box">Aún no hay pruebas subidas en este repositorio.</div>';
          return;
        }

        // Orden numérico natural (ej: prueba-1, prueba-2, prueba-10)
        pruebas.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        grid.innerHTML = pruebas.map(prueba => {
          const limpio = prueba.name.replace('.html', '').replace(/[-_]/g, ' ');
          const icono = obtenerIcono(prueba.name);
          
          return `
            <a class="card" href="${prueba.name}">
              <div class="card-top">
                <div class="card-icon">${icono}</div>
                <div class="card-title">${limpio}</div>
              </div>
              <div class="card-action">
                Comenzar <span>→</span>
              </div>
            </a>
          `;
        }).join('');

      } catch (e) {
        grid.innerHTML = `
          <div class="status-box">
            No se pudieron cargar las pruebas.<br>
            Asegúrate de que el repositorio <code>osv927/pruebas</code> sea público.
          </div>
        `;
      }
    }

    listarRetos();
  </script>
</body>
</html>
