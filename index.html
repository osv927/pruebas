<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servidor Personal Osvaldo Matías | Repaso Escolar</title>
  <!-- Fuentes estilo Roblox / Bloques -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-sky: #4aa3df;
      --stud-pattern: #3b8ec4;
      --card-bg: #232527;
      --card-border: #111215;
      --roblox-green: #00b06f;
      --roblox-green-shadow: #007a4d;
      --roblox-yellow: #f5a623;
      --text: #ffffff;
      --text-muted: #abb1b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', cursive, system-ui, sans-serif;
      /* Textura tipo studs / bloques en el fondo */
      background-color: var(--bg-sky);
      background-image: 
        radial-gradient(circle, var(--stud-pattern) 18%, transparent 19%),
        radial-gradient(circle, var(--stud-pattern) 18%, transparent 19%);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    /* Header estilo Roblox Top Bar */
    header {
      text-align: center;
      margin-bottom: 30px;
      width: 100%;
      max-width: 820px;
      background: rgba(35, 37, 39, 0.94);
      border: 4px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 0px rgba(0, 0, 0, 0.25);
    }

    .badge-lobby {
      display: inline-block;
      background: var(--roblox-yellow);
      color: #111;
      padding: 4px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      border: 2px solid #000;
      box-shadow: 0 3px 0 #000;
    }

    h1 {
      font-family: 'Lilita One', cursive;
      font-size: 2.5rem;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0 6px 0 rgba(0,0,0,0.4);
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.15rem;
      font-weight: 600;
    }

    /* Grid de Portales / Pads */
    .grid {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    /* Tarjeta estilo Bloque 3D */
    .card {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 190px;
      box-shadow: 0 8px 0px #111215;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 0px #111215;
    }

    .card:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0px #111215;
    }

    /* Tag de la tarjeta */
    .card-zone {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      color: var(--roblox-yellow);
      text-transform: uppercase;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    .card-icon {
      font-size: 2.2rem;
      background: #111215;
      border: 3px solid #3b3f46;
      padding: 10px;
      border-radius: 14px;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .card-title {
      font-family: 'Lilita One', cursive;
      font-size: 1.35rem;
      line-height: 1.2;
      color: #fff;
      text-transform: capitalize;
    }

    /* Botón verde 3D de Spawn */
    .btn-spawn {
      margin-top: 20px;
      background: var(--roblox-green);
      border: 3px solid #000;
      border-radius: 12px;
      color: #fff;
      font-family: 'Lilita One', cursive;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 5px 0 var(--roblox-green-shadow);
      text-transform: uppercase;
    }

    .card:hover .btn-spawn {
      background: #00c97e;
    }

    /* Mensajes de estado */
    .status-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 4px dashed #3b3f46;
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 1.2rem;
      box-shadow: 0 8px 0 #111215;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-lobby">⭐ BIENVENIDO A LA ZONA DE REPASO</div>
    <h1>OSVALDO MATIAS, ESPERO ESTES LISTO</h1>
    <p class="subtitle">Entra a cualquier portal para entrenar. ¡Puedes repetir las veces que quieras!</p>
  </header>

  <main class="grid" id="contenedor-pruebas">
    <div class="status-box">Buscando portales activos en el servidor...</div>
  </main>

  <script>
    const GITHUB_USER = 'osv927';
    const GITHUB_REPO = 'pruebas';
    const FOLDER_PATH = '';

    function categorizar(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes('mate') || n.includes('suma') || n.includes('resta') || n.includes('fraccion') || n.includes('multiplica') || n.includes('divis')) {
        return { icono: '⚡', tag: 'Prueba tu conocimiento' };
      }
      if (n.includes('esp') || n.includes('lengua') || n.includes('acento') || n.includes('lectura') || n.includes('palabra')) {
        return { icono: '📖', tag: 'Prueba tu conocimiento' };
      }
      if (n.includes('cien') || n.includes('insecto') || n.includes('animal') || n.includes('planta') || n.includes('cuerpo')) {
        return { icono: '🧪', tag: 'Prueba tu conocimiento' };
      }
      if (n.includes('soc') || n.includes('historia') || n.includes('mapa') || n.includes('geografia')) {
        return { icono: '🗺️', tag: 'Prueba tu conocimiento' };
      }
      return { icono: '🎮', tag: 'Prueba tu conocimiento' };
    }

    async function listarRetos() {
      const grid = document.getElementById('contenedor-pruebas');
      const endpoint = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;

      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error('Error al conectar');
        const items = await res.json();

        const pruebas = items.filter(f => 
          f.type === 'file' &&
          f.name.endsWith('.html') &&
          f.name.toLowerCase() !== 'index.html'
        );

        if (pruebas.length === 0) {
          grid.innerHTML = '<div class="status-box">No hay pruebas disponibles en este momento.</div>';
          return;
        }

        pruebas.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        grid.innerHTML = pruebas.map(p => {
          const limpio = p.name.replace('.html', '').replace(/[-_]/g, ' ');
          const { icono, tag } = categorizar(p.name);

          return `
            <a class="card" href="${p.name}">
              <span class="card-zone">${tag}</span>
              <div class="card-header">
                <div class="card-icon">${icono}</div>
                <div class="card-title">${limpio}</div>
              </div>
              <div class="btn-spawn">
                ▶ SPAWN
              </div>
            </a>
          `;
        }).join('');

      } catch (err) {
        grid.innerHTML = `
          <div class="status-box">
            No se pudo conectar con el servidor.<br>
            Asegúrate de que <code>osv927/pruebas</code> sea público.
          </div>
        `;
      }
    }

    listarRetos();
  </script>
</body>
</html>
